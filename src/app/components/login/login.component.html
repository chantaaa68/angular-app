<div class="d-flex justify-content-center flex-column col-8 mt-5 mx-auto">
  <form [formGroup]="form">
    <mat-form-field class="w-100">
      <mat-label>メールアドレス</mat-label>
      <input matInput type="text" formControlName="email" />
      <mat-error>メアドは必須です</mat-error>
    </mat-form-field>
    <mat-form-field class="w-100">
      <mat-label>パスワード</mat-label>
      <input matInput type="text" formControlName="password" />
      <mat-error>パスワードは必須です</mat-error>
    </mat-form-field>

    <div *ngIf="loginErrorFlg">
      <p class="fs-5 d-flex justify-content-center text-danger">
        {{ loginErrorMessage }}
      </p>
    </div>

    <div class="d-flex justify-content-center">
      <button
        mat-raised-button
        class="fs-5 col-6 btn btn-primary"
        (click)="login()"
      >
        ログイン
      </button>
    </div>

    <div class="d-flex justify-content-center">
      <button class="col-3 mt-5 btn btn-success" (click)="registKakeibo()">
        新しく家計簿を作る
      </button>
    </div>
  </form>
</div>
