<div class="d-flex align-items-center justify-content-center mt-5 fw-bold">
  <button class="fs-5 btn" (click)="addMonth(-1)">
    <mat-icon>chevron_left</mat-icon>
  </button>
  <p class="fs-4 p-2">{{ today | date : "yyyy年MM月" }}</p>
  <button class="fs-5 btn" (click)="addMonth(1)">
    <mat-icon>chevron_right</mat-icon>
  </button>
</div>

<mat-form-field
  class="d-flex justify-content-center flex-column col-6 mt-5 mx-auto"
>
  <mat-label>支出/収入</mat-label>

  <mat-select
    [formControl]="inoutFlg"
    (selectionChange)="inoutCategoryChange($event)"
  >
    <mat-option *ngFor="let option of inoutOption" [value]="option.value">
      {{ option.label }}
    </mat-option>
  </mat-select>
</mat-form-field>

<div *ngIf="monthlyResult.length === 0">
  <p
    class="d-flex align-items-center justify-content-center flex-column mx-auto fs-5"
  >
    この月のデータは存在しません
  </p>
</div>
<div *ngIf="monthlyResult.length != 0">
  <div style="height: 400px; width: 100%">
    <igx-data-pie-chart
      [dataSource]="monthlyResult"
      width="100%"
      height="100%"
      valueMemberPath="value"
      labelMemberPath="category"
      othersCategoryThreshold="0"
      outlines="white"
      leaderLineVisibility="visible"
    >
    </igx-data-pie-chart>
  </div>
  <div
    class="d-flex justify-content-center flex-column col-6 text-center p-2 border bg-light mx-auto"
  >
    <p class="fs-6 m-0">{{ inoutFlg.value === 0 ? "支出" : "収入" }}</p>
    <p *ngIf="inoutFlg.value === 1" class="fs-5 fw-bold m-0 text-success">
      {{ monthlyMoney }}
    </p>
    <p *ngIf="inoutFlg.value === 0" class="fs-5 fw-bold m-0 text-danger">
      {{ monthlyMoney }}
    </p>
  </div>
</div>
